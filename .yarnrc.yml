compressionLevel: mixed

enableGlobalCache: false

# Dependencies' install scripts stay off: nothing in the 2.x tree needs one.
enableScripts: false

nodeLinker: node-modules

# Advisories with no fixed release to move to, checked 2026-10-16. Each is
# dropped from this list when its package ships a fix; `yarn lint:audit`
# reports it again then.
npmAuditIgnoreAdvisories:
  # braces <=3.0.3, stack exhaustion on deeply nested patterns; 3.0.3 is the
  # latest release.
  - '1240992'
  # node-forge <=1.4.0, PKCS#1 v1.5 signature verification; 1.4.0 is the latest
  # release, reached through listhen.
  - '1240912'
