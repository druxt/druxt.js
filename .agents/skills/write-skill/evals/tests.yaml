# Evals for the write-skill skill, run by .agents/promptfooconfig.yaml.
- description:
    "write-skill: Creates .agents/skills/<verb-object-name>/ with SKILL.md using only spec
    frontmatter, a description with 'Use when', evals/tests.yaml, adds it to
    the AGENTS.md Skills table, and runs yarn lint:skills."
  vars:
    request: Add a druxt.js contributor skill that walks someone through updating the perf-audit baseline.
    forbidden:
      - git push
      - --no-verify
  assert:
    - type: skill-used
      value: write-skill
    - type: llm-rubric
      value: Writes or proposes the skill under .agents/skills, not .claude/skills directly
      metric: expectations
    - type: llm-rubric
      value: Writes or proposes an evals/tests.yaml for it, with prompts that should and should not load it
      metric: expectations
    - type: llm-rubric
      value: Adds or proposes a row for the skill in the AGENTS.md Skills table
      metric: expectations
    - type: llm-rubric
      value: Runs or plans yarn lint:skills
      metric: expectations
- description:
    'write-skill: Says a one-line rule that applies to every session belongs in AGENTS.md (where
    it already is), not a new skill.'
  vars:
    request:
      Should 'every @param needs a type and description' go in a new druxt.js skill or somewhere
      else?
    forbidden:
      - git push
  assert:
    - type: skill-used
      value: write-skill
    - type: llm-rubric
      value: Recommends AGENTS.md for a one-line rule that applies everywhere
      metric: expectations
    - type: llm-rubric
      value: Does not create a new skill for it
      metric: expectations
- description: 'write-skill triggers: Create a new druxt.js skill for running the e2e tests.'
  vars:
    request: Create a new druxt.js skill for running the e2e tests.
  assert:
    - type: skill-used
      value: write-skill
- description: 'write-skill triggers: yarn lint:skills is failing on my SKILL.md, help.'
  vars:
    request: yarn lint:skills is failing on my SKILL.md, help.
  assert:
    - type: skill-used
      value: write-skill
- description:
    'write-skill triggers: Improve the description of the open-pr skill in druxt.js so it triggers
    more reliably.'
  vars:
    request: Improve the description of the open-pr skill in druxt.js so it triggers more reliably.
  assert:
    - type: skill-used
      value: write-skill
- description: 'write-skill triggers: Should this druxt.js guidance be a skill or go in AGENTS.md?'
  vars:
    request: Should this druxt.js guidance be a skill or go in AGENTS.md?
  assert:
    - type: skill-used
      value: write-skill
- description: 'write-skill does not trigger: Open a pull request for my druxt.js branch.'
  vars:
    request: Open a pull request for my druxt.js branch.
  assert:
    - type: not-skill-used
      value: write-skill
- description: 'write-skill does not trigger: Fix the failing druxt-router unit test.'
  vars:
    request: Fix the failing druxt-router unit test.
  assert:
    - type: not-skill-used
      value: write-skill
- description: 'write-skill does not trigger: Triage the new druxt.js issue.'
  vars:
    request: Triage the new druxt.js issue.
  assert:
    - type: not-skill-used
      value: write-skill
- description: 'write-skill does not trigger: Explain how druxt-site builds its pages.'
  vars:
    request: Explain how druxt-site builds its pages.
  assert:
    - type: not-skill-used
      value: write-skill
