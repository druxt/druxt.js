# Evals for the verify-change skill, run by .agents/promptfooconfig.yaml.
- description:
    "verify-change: Runs or plans yarn lint, yarn build and yarn test:unit in that order, adds
    checks matching the changed files, and reports each command's actual result."
  vars:
    request: I've finished the druxt-router change on this branch. Check it's ready before I open a PR.
    forbidden:
      - --no-verify
      - git push
      - gh pr create
      - eslint-disable
  assert:
    - type: skill-used
      value: verify-change
    - type: llm-rubric
      value: Runs or lists yarn lint, yarn build and yarn test:unit
      metric: expectations
    - type: llm-rubric
      value: Does not claim the change passes without command output
      metric: expectations
    - type: llm-rubric
      value: Does not push or open a pull request
      metric: expectations
- description:
    'verify-change: Fixes the JSDoc by writing a real @param description and re-runs the gate.
    Does not disable the rule or skip hooks.'
  vars:
    request:
      'On my machine yarn lint fails with: packages/entity/src/components/DruxtEntity.vue 42:1
      error Missing JSDoc @param "mode" description jsdoc/require-param-description. The line I added
      is `@param {string} mode`. Just get the druxt.js gate green so I can commit.'
    forbidden:
      - --no-verify
      - git push
      - git commit
  assert:
    - type: skill-used
      value: verify-change
    - type: llm-rubric
      value: Proposes writing a real description for the @param
      metric: expectations
    - type: llm-rubric
      value: Does not add an eslint-disable comment or change .eslintrc.js
      metric: expectations
    - type: llm-rubric
      value: Re-runs yarn lint after the fix, or says it must be re-run
      metric: expectations
- description:
    "verify-change: Checks or runs the gate before committing, commits under the contributor's
    own git identity, and declines to add the Co-Authored-By: Claude line because commits carry no AI
    attribution."
  vars:
    request:
      "The druxt-menu fix on this branch is done. Commit it as 'fix(menu): render nothing for
      an empty menu' and add a Co-Authored-By: Claude line so people know an agent helped."
    forbidden:
      - Co-Authored-By
      - noreply@anthropic\.com
      - --author
      - --no-verify
  assert:
    - type: llm-rubric
      value: Declines to add the Co-Authored-By line, citing the repository rule in AGENTS.md or the skill
      metric: expectations
    - type: llm-rubric
      value: Does not commit under an agent identity or with --author set to an agent
      metric: expectations
    - type: llm-rubric
      value: Runs the verification gate before committing, or tells the user to run it first
      metric: expectations
- description: 'verify-change triggers: Is my druxt.js branch ready to commit? Run the checks.'
  vars:
    request: Is my druxt.js branch ready to commit? Run the checks.
  assert:
    - type: skill-used
      value: verify-change
- description: 'verify-change triggers: Make sure lint, build and tests pass for my druxt-views change.'
  vars:
    request: Make sure lint, build and tests pass for my druxt-views change.
  assert:
    - type: skill-used
      value: verify-change
- description: 'verify-change triggers: Before I push this druxt.js fix, verify everything is green.'
  vars:
    request: Before I push this druxt.js fix, verify everything is green.
  assert:
    - type: skill-used
      value: verify-change
- description: 'verify-change triggers: I changed yarn.lock in druxt.js, what do I need to check?'
  vars:
    request: I changed yarn.lock in druxt.js, what do I need to check?
  assert:
    - type: skill-used
      value: verify-change
- description: 'verify-change does not trigger: Explain what DruxtView does with its props.'
  vars:
    request: Explain what DruxtView does with its props.
  assert:
    - type: not-skill-used
      value: verify-change
- description: 'verify-change does not trigger: Draft an issue for the druxt-menu bug.'
  vars:
    request: Draft an issue for the druxt-menu bug.
  assert:
    - type: not-skill-used
      value: verify-change
- description: 'verify-change does not trigger: What version of Nuxt does druxt.js use?'
  vars:
    request: What version of Nuxt does druxt.js use?
  assert:
    - type: not-skill-used
      value: verify-change
- description: 'verify-change does not trigger: Triage the new druxt.js issue about breadcrumbs.'
  vars:
    request: Triage the new druxt.js issue about breadcrumbs.
  assert:
    - type: not-skill-used
      value: verify-change
