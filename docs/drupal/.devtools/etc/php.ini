; Used via PHPRC by .devtools/helpers.php's drush() wrapper. Drupal installs
; and Tome imports can exceed PHP's default 128M memory_limit, and `-d`
; overrides on the parent process don't reach the child PHP process Drush's
; SiteProcess spawns for `site-install` - PHPRC does, since it's inherited
; as an environment variable rather than passed as a CLI flag. This file is
; deliberately minimal: PHP still loads extensions from its normal scan
; directory regardless of PHPRC, so this only needs to override the one
; setting that actually needs overriding.
memory_limit = -1
