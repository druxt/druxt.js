name: Druxt examples backend
description: 'Configures the Umami-based backend for the druxt.js frontend examples: the Druxt module stack, anonymous access to the Druxt JSON:API resources and the image styles the examples link to. The OAuth consumer the examples hardcode is created by the druxt_examples module this recipe installs.'
# A recipe installs modules with config-entity import switched off, so the
# image styles live in this recipe's config/ directory, not in the module's
# config/install.
install:
  # jsonapi and image are already on an Umami site; listed so the recipe may
  # act on their config and import its own image styles.
  - jsonapi
  - image
  - druxt
  - simple_oauth
  - druxt_examples
config:
  actions:
    # Core ships JSON:API read-only, which answers every PATCH with 405. The
    # Content Ops Console example writes back over its OAuth token.
    jsonapi.settings:
      simpleConfigUpdate:
        read_only: false
    # The frontend examples fetch schemas, displays, menus and views as
    # anonymous JSON:API reads; without this every DruxtClient model fetch
    # returns 403 "Required permissions: administer ... display".
    user.role.anonymous:
      grantPermissions:
        - 'access druxt resources'
    user.role.authenticated:
      grantPermissions:
        - 'access druxt resources'
