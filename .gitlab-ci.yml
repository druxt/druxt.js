---
# GitLab CI for the druxt.js monorepo, 2.0.x line: lint → test → secret-detection,
# with collapsible section helpers and a per-file JSON/shell/YAML sweep.
#
# On 2.0.x GitHub runs .github/workflows/ci.yml, which mirrors the lint, unit
# test and release jobs here, and codeql-analysis.yml, which reads the tree.
# The other GitHub workflows are 1.x's; release.yml is kept off 2.0.x until
# the 2.x release flow returns.
# Of test:release only the release script tests run there; the rehearsal half
# (snapshot version, build, release:check) returns with the packages. The 1.x
# example, end-to-end, performance and preview jobs return as 2.x versions
# once the examples are ported.

stages:
  - lint
  - test
  - secret-detection
  - preview

variables:
  SECRET_DETECTION_ENABLED: 'true'

# Secret scanning is gitleaks, not GitLab's Security/Secret-Detection
# template. That template is an Ultimate-tier feature: on a non-Ultimate
# instance the include produces no job at all, so the configuration reads as
# coverage while scanning nothing. This job was previously that include, and
# was both required and inert, which is the worst of the two.
secret_detection:
  stage: secret-detection
  image: alpine:3.21
  interruptible: true
  # gitleaks reads git history and needs nothing this pipeline builds.
  dependencies: []
  variables:
    # Without this the scan covers only as much history as the project's clone
    # depth happens to allow, and a secret in an older commit reads as clean.
    # A scan whose coverage depends on an unrelated project setting is a scan
    # that can quietly stop scanning.
    GIT_DEPTH: 0
    GITLEAKS_VERSION: '8.30.1'
    GITLEAKS_SHA256_X64: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    GITLEAKS_SHA256_ARM64: 'e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080'
  script:
    - section_start "gitleaks" "Scanning for committed secrets"
    - apk add --no-cache curl tar git > /dev/null
    # Detect rather than assume, as the cloudflared block below already does.
    # This runner is arm64; the x64 archive only ran because the image resolved
    # to amd64 under emulation. Its checksum verifies either way, so the failure
    # would arrive as an exec format error rather than as a download problem.
    - |
      case "$(uname -m)" in
        aarch64|arm64) gl_arch=arm64; gl_sha="$GITLEAKS_SHA256_ARM64" ;;
        x86_64)        gl_arch=x64;   gl_sha="$GITLEAKS_SHA256_X64" ;;
        *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${gl_arch}.tar.gz"
      echo "${gl_sha}  gitleaks.tar.gz" | sha256sum -c -
      tar -xzf gitleaks.tar.gz gitleaks
    - ./gitleaks detect --source . --no-banner --redact --verbose
    - section_end "gitleaks"
    # A scan that finds nothing looks identical to a scan that cannot find
    # anything. Plant three credentials outside the repository and assert all
    # three are reported, so a bad download, a config change or a widened
    # allowlist fails the job instead of passing it quietly.
    #
    # Each value is split across its own prefix so no fragment in this file
    # triggers the rule it is meant to exercise: the repository scan above runs
    # over this file too, and a canary that flags itself would need an ignore
    # entry, which is the thing being guarded against.
    #
    # Fixed values, not generated ones. Detection is keyword-driven rather than
    # entropy-driven, so a generated credential fires only sometimes and
    # presents as flake. A value verified once keeps firing. Invented, not
    # copied from vendor documentation: gitleaks allowlists documentation keys,
    # and a canary built from one is inert in exactly the way this catches.
    - section_start "canary" "Checking that the scanner still detects"
    - |
      canary="$(mktemp -d)"
      pat="gh""p_8fK2mQ7xR4tV9nB3jH6yW1sZ5cD8gL0aE4uY"
      stripe="sk""_live_51aBcD2eFgH3iJkL4mNoP5qR6sTuV7wXyZ8a"
      slack="xo""xb-263594753641-2529420432-J1n4h6a9pQrStUvWxYz1AbCd"
      printf 'a = "%s"\nb = "%s"\nc = "%s"\n' "$pat" "$stripe" "$slack" > "$canary/canary.txt"
      # --config is what makes this canary mean what the comment above says.
      # Scanning a temp directory without it uses gitleaks' embedded defaults,
      # so a widened allowlist in .gitleaks.toml cannot affect the result:
      # measured, the canary scores 3 of 3 against a config that allowlists
      # everything. With --config it scores 0 and the job fails, which is the
      # behaviour this check exists for.
      ./gitleaks detect --no-git --source "$canary" --config .gitleaks.toml \
        --no-banner --redact \
        --report-format json --report-path "$canary/report.json" || true
      found=$(grep -c '"RuleID"' "$canary/report.json" || true)
      rm -rf "$canary"
      if [ "$found" != "3" ]; then
        echo "The canary planted 3 credentials and gitleaks reported $found."
        echo "The scan above proves nothing while this is true."
        exit 1
      fi
      echo "Canary detected 3 of 3 planted credentials."
    - section_end "canary"
    # The check above proves the scanner detects. It says nothing about whether
    # an allowlist has widened from the one rule it was written for to all of
    # them, which is what a top-level [allowlist] does and what this config
    # previously had for the Yarn bundles.
    #
    # Plant a private key at a path the generic-api-key allowlist matches. It
    # must still be reported: that path is excused from one detector, not from
    # detection. Fixed value, for the same reason as the credentials above.
    - section_start "scope" "Checking the allowlists are scoped to one rule each"
    - |
      scope="$(mktemp -d)"
      mkdir -p "$scope/.yarn/releases"
      # Split like the three credentials above, and for the same reason: the
      # repository scan reads this file, so a PEM header written here in one
      # piece is itself a finding. Assembled at runtime, the trigger never
      # appears contiguously in the configuration.
      pem_head="-----BEGIN"" PRIVATE KEY-----"
      pem_tail="-----END"" PRIVATE KEY-----"
      # Body generated rather than embedded. Unlike the three credentials
      # above, private-key matches on the header keyword and ignores the body,
      # so nothing is lost by generating it, and a base64 blob in this file
      # would only give the spell checker something to complain about.
      printf '%s\n%s\n%s\n' "$pem_head" \
        "$(head -c 96 /dev/urandom | base64 | tr -d '\n')" "$pem_tail" \
        > "$scope/.yarn/releases/yarn-9.9.9.cjs"
      ./gitleaks detect --no-git --source "$scope" --config .gitleaks.toml \
        --no-banner --redact \
        --report-format json --report-path "$scope/report.json" || true
      scoped=$(grep -c '"RuleID"' "$scope/report.json" || true)
      rm -rf "$scope"
      if [ "$scoped" -lt 1 ]; then
        echo "A private key at an allowlisted Yarn path was not reported."
        echo "An allowlist meant for one detector is suppressing all of them."
        exit 1
      fi
      echo "Allowlists are scoped: a private key on an excused path is still reported."
    - section_end "scope"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: mcr.microsoft.com/devcontainers/python:3
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

#
# --- Node Job Template ---
#
# All node-based jobs share the same image and Yarn Berry cache. The cache key
# is the yarn.lock hash prefixed with the Node image tag, so a cache hit skips
# both the download and the native addon compilation (deasync, re2, etc.).
# The image prefix prevents restoring native binaries compiled under a
# different Node version. enableGlobalCache: false in .yarnrc.yml keeps the
# cache in .yarn/cache/ (project-local, CI-cacheable).
.node:
  image: node:24.18.0
  cache:
    - key:
        files:
          - yarn.lock
        prefix: node-24.18.0
      paths:
        - .yarn/cache/
        - node_modules/
      policy: pull-push

#
# --- Lint Stage ---
#

# tsconfig files are JSON with comments, which TypeScript reads and this
# strict parser does not, so they are left to the typecheck.
lint:json:
  stage: lint
  interruptible: true
  script:
    - section_start "json-lint" "Validating JSON files"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if python3 -m json.tool "$f" > /dev/null 2>&1; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.json' -not -path '*/.git/*' -not -path '*/node_modules/*' \
        -not -path '*/dist/*' -not -path '*/.vscode/*' -not -path '*/.devcontainer/*' -not -path '*/templates/*' \
        -not -name 'tsconfig*.json' -print0)
      echo "--- $count JSON file(s) checked ---"
      exit "$rc"
    - section_end "json-lint"

lint:shell:
  stage: lint
  interruptible: true
  script:
    - section_start "shell-lint" "Checking shell script syntax"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if bash -n "$f" 2>/dev/null; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.sh' -not -path '*/.git/*' -not -path '*/node_modules/*' -print0)
      echo "--- $count shell file(s) checked ---"
      exit "$rc"
    - section_end "shell-lint"

lint:yaml:
  stage: lint
  interruptible: true
  script:
    - section_start "yaml-lint" "Linting YAML files"
    - pip install yamllint -q
    - yamllint .gitlab-ci.yml
    - section_end "yaml-lint"

lint:markdown:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "md-lint" "Linting Markdown files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:md
    - section_end "md-lint"

lint:cspell:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "cspell" "Spell checking project files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:cspell
    - section_end "cspell"

# AI-tell prose lint over the repo's own markdown and source comments; the
# same pinned Vale + ai-tells install the GitHub lint job uses.
lint:prose:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "prose-lint" "Linting prose (Vale, ai-tells)"
    - corepack enable
    - yarn install --immutable
    - yarn lint:prose
    - section_end "prose-lint"

lint:js:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "eslint" "Linting JS/Vue sources"
    - corepack enable
    - yarn install --immutable
    - yarn lint
    - section_end "eslint"

# Two-tier: the full recursive audit (including devDependencies) is reporting
# only. The production-only gate is what actually blocks the pipeline -
# shipped runtime dependencies must stay clean.
lint:dependency-audit:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "audit-full" "Full dependency audit (reporting only, includes devDependencies)"
    - corepack enable
    - yarn install --immutable
    - yarn lint:audit:full || true
    - section_end "audit-full"
    - section_start "audit-production" "Production dependency audit (blocking)"
    - yarn lint:audit
    - section_end "audit-production"

lint:knip:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "knip" "Checking for unused/unlisted dependencies"
    - corepack enable
    - yarn install --immutable
    - yarn lint:knip
    - section_end "knip"

# The same lint as yarn lint:changesets: the shape and the wording rules of
# .changeset/*.md, with a preview of each package's changelog.
lint:changesets:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "changesets" "Checking the pending changesets"
    - corepack enable
    - yarn install --immutable
    - yarn lint:changesets --preview
    - section_end "changesets"

# Mirrors the GitHub lint job's skills step: agnix over the contributor
# skills, AGENTS.md and agent config. No build, credentials or model tokens.
lint:skills:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "skills" "Checking the contributor skills"
    - corepack enable
    - yarn install --immutable
    - yarn lint:skills
    - section_end "skills"

# Mirrors the GitHub commits job for merge requests: Conventional Commits,
# made by the person contributing them, with no AI attribution.
lint:commits:
  extends: .node
  stage: lint
  interruptible: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "commits" "Checking the merge request's commits"
    # In a merged-results pipeline CI_COMMIT_SHA is a temporary merge commit,
    # and a range ending there takes in the target branch's newer commits too.
    # End at the source branch's head, which GitLab sets only in that case.
    - HEAD_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    # A merge request cannot loosen the policy that checks its own commits.
    # Take the policy from the target branch's current tip (the diff base can
    # be older), fetched with the job token, and fall back to the diff base
    # if the fetch fails. commitlint runs from a worktree of that commit, with
    # its package.json, lockfile and commitlint.config.js.
    - |
      POLICY_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      # Fetch from the runner's own origin, which already carries the server's
      # protocol, host, port and the job's credentials. A hand-built https URL
      # was refused on every http instance, so the policy above silently fell
      # back to the diff base on every run and never took effect.
      if git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"; then
        POLICY_SHA="$(git rev-parse FETCH_HEAD)"
      else
        echo "Could not fetch the target branch; using the diff base's commit policy."
      fi
      # A reused runner checkout can still list an earlier run's worktree.
      git worktree remove --force .policy 2>/dev/null || true
      git worktree prune
      git worktree add .policy "$POLICY_SHA"
    - corepack enable
    - (cd .policy && yarn install --immutable)
    - (cd .policy && yarn lint:commit --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$HEAD_SHA" --verbose)
    # The merge request's identity list is used only where the policy commit
    # has none yet.
    - |
      identities=.policy/.husky/agent-identities
      [ -f "$identities" ] || identities=.husky/agent-identities
      if git log --format='%an <%ae>%n%cn <%ce>' "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$HEAD_SHA" | grep -iEf "$identities"; then
        echo "A commit above is made under an AI agent's identity. See AGENTS.md."
        exit 1
      fi
    - section_end "commits"

# Nothing here needs Drupal, so it is ungated:
# a package that does not build is worth knowing about on every pipeline, and
# it is the cheapest signal in the file.
test:build:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "build" "Building every package"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - section_end "build"
    # A build that produces nothing still exits zero. Assert every workspace
    # with a build script built something, or this job passes on an empty dist.
    - section_start "verify" "Checking the build produced artefacts"
    - |
      set -euo pipefail
      # Yarn drops an empty workspaces list, so a tree with no package yet has
      # no key at all, and passes. Once the key is there, checking nothing fails.
      if ! node -e 'process.exit("workspaces" in require("./package.json") ? 0 : 1)'; then
        echo "no workspaces yet"
      else
        checked=0
        # Parsed as JSON, so a change in the line's shape fails here rather
        # than matching nothing.
        dirs=$(yarn workspaces list --json | node -e '
          const lines = require("fs").readFileSync(0, "utf8").trim().split("\n")
          for (const line of lines) {
            const { location } = JSON.parse(line)
            if (location !== ".") console.log(location)
          }')
        for dir in $dirs; do
          # The published packages only: the example apps build with `nuxt build`, into .output.
          node -e 'const p = require("./" + process.argv[1] + "/package.json"); process.exit(p.name?.startsWith("@druxt/") && p.scripts?.build ? 0 : 1)' "$dir" || continue
          count=$( (find "$dir/dist" -type f 2>/dev/null || true) | wc -l)
          echo "$dir: $count built file(s)"
          [ "$count" -gt 0 ] || { echo "$dir built no dist output" >&2; exit 1; }
          checked=$((checked + 1))
        done
        echo "$checked workspace(s) checked"
        [ "$checked" -gt 0 ] || { echo "package.json declares workspaces, but no @druxt/* workspace with a build script was checked" >&2; exit 1; }
      fi
    - section_end "verify"

# The unit tests need no Drupal, so they are ungated. They import the
# workspaces through their dist, so the packages build first.
test:unit:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "unit" "Running the unit tests"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn vitest run --project unit --project nuxt
    - section_end "unit"

# Rehearses a release up to the publish: cut a snapshot, build it, and run
# the pre-publish gate against npm.
test:release:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "release-tests" "Testing the release scripts"
    - corepack enable
    - yarn install --immutable
    - yarn release:check:test
    - section_end "release-tests"
    - section_start "release-rehearsal" "Rehearsing a dev snapshot"
    - |
      set -euo pipefail
      count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
      echo "$count pending changeset(s)"
      if [ "$count" -gt 0 ]; then
        rm -f .changeset/pre.json
        yarn changeset version --snapshot dev
      fi
      yarn build
      yarn release:check
    - section_end "release-rehearsal"

#
# --- Drupal-backed jobs ---
#
# One provisioner, shared. examples/drupal is installed with plain Composer
# against SQLite and served by PHP's built-in server: no Docker, no DDEV. An earlier
# attempt at docker:dind plus DDEV on this runner hit an arm64/amd64 image
# mismatch and then unresolvable service networking, which is why this shape
# exists.
#
# Jobs inherit this with `extends:` and provision their own backend. They must
# not `needs:` a shared provisioning job: a provisioner skipped by its own
# rules would take its dependents with it, and the pipeline would report "e2e
# did not run" rather than "e2e was gated out". A second provision when two
# jobs run is the right price for that.
.drupal-backend:
  image: php:8.3
  interruptible: true
  variables:
    WEBSERVER_HOST: 127.0.0.1
    WEBSERVER_PORT: '8888'
    # python3/make/g++: the monorepo's native addons (deasync, re2) need
    # a compile toolchain that the minimal php image lacks.
    PHP_APT_PACKAGES: 'git unzip curl ca-certificates python3 python3-setuptools build-essential libsqlite3-dev libzip-dev libicu-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev libxml2-dev'
    PHP_EXTENSIONS: 'mbstring pdo_sqlite intl gd xml zip opcache'
  cache:
    - key:
        files:
          - yarn.lock
        prefix: php83-node24
      paths:
        - .yarn/cache/
        - node_modules/
      policy: pull-push
    - key:
        files:
          - examples/drupal/composer.lock
        prefix: php83
      paths:
        - examples/drupal/vendor/
      policy: pull-push
  before_script:
    # default.before_script's section helpers are replaced by this
    # before_script, so redefine them here.
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'
    - apt-get update -yqq && apt-get install -yqq $PHP_APT_PACKAGES
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" $PHP_EXTENSIONS
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --version=2.10.2
    - export NVM_DIR="$HOME/.nvm" && curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
    - . "$NVM_DIR/nvm.sh" --no-use && nvm install && nvm use
    - node --version
    - corepack enable

# Provisioning steps, pulled into a job's script with
# `!reference [.provision-backend, script]`. A hidden job rather than a YAML
# anchor so it composes with the rest of a script list.
.provision-backend:
  script:
    - section_start "backend" "Provisioning the examples/drupal backend (SQLite, Docker-free)"
    - |
      set -euo pipefail
      cd examples/drupal
      .devtools/assemble
      .devtools/provision
      nohup .devtools/start > /tmp/drupal-start.log 2>&1 &
      cd "$CI_PROJECT_DIR"
    - |
      for i in $(seq 1 60); do
        if curl -fsS "http://${WEBSERVER_HOST}:${WEBSERVER_PORT}/" >/dev/null 2>&1; then echo "backend up"; break; fi
        sleep 5
      done
      # Not just the loop: a loop that times out still falls through, so
      # assert once more and fail rather than continue against no backend.
      curl -fsS "http://${WEBSERVER_HOST}:${WEBSERVER_PORT}/" >/dev/null
    - section_end "backend"

# The sources against Nuxt's generated types. The typecheck app lists no
# module yet, so this checks the test harness and the configs; the core port
# adds @druxt/core, whose dist preparing the app then loads, which is why the
# packages build first. The consumer check against the built declarations,
# typecheck:dist, returns with the packages.
test:typecheck:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "typecheck" "Typechecking the sources"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn typecheck
    - section_end "typecheck"

# The standalone suite against the provisioned backend. For now it holds one
# check, that the backend answers /jsonapi as JSON:API. The module ports add
# each module alone in a real Nuxt 4 app, built and served, rendering the
# backend's content with nothing of Nuxt stubbed.
test:standalone:
  extends: .drupal-backend
  stage: test
  needs: []
  script:
    - !reference [.provision-backend, script]
    # The backend's address, from the variables the provision step serves it on.
    - export DRUXT_BASE_URL="http://${WEBSERVER_HOST}:${WEBSERVER_PORT}"
    - section_start "build" "Building the packages"
    - yarn install --immutable
    - yarn build
    - section_end "build"
    - section_start "standalone" "Each module installed alone"
    - yarn test:standalone
    - section_end "standalone"

#
# --- VS Code tunnel (manual) ---
#
# An editor and a terminal on the runner, holding this branch's checkout, for
# when a failure only reproduces in CI. Separate from examples:preview because
# that job provisions Drupal and the example apps first: this one gives a shell
# in the job's own environment and nothing else, so it starts in a minute
# rather than in twenty.
#
# Manual and never automatic. It is an interactive shell with the job's
# variables, so it exists only when someone asked for it.
#
# Authentication, by the script rather than by this job:
# - CLOUDFLARE_TUNNEL_TOKEN set: a named tunnel, with a Cloudflare Access
#   policy in front. Set VSCODE_TUNNEL_HOSTNAME to match.
# - otherwise: a Quick Tunnel behind a generated password, printed in this
#   job's log and nowhere else. The script refuses to generate one on a public
#   project, where that log is world-readable, and names VSCODE_TUNNEL_PASSWORD
#   as the masked variable to set instead.
#
# allow_failure, so a tunnel nobody started does not hold the pipeline, and
# interruptible: false, so a push to the branch does not close the session
# someone is working in.
#
# On 2.0.x it runs on the Node 24 template, with the packages installed and
# built before the tunnel opens, so the editor's terminal can run the
# examples and checks straight away. A failed build still opens the tunnel.
vscode:tunnel:
  extends: .node
  stage: preview
  interruptible: false
  when: manual
  needs: []
  allow_failure: true
  resource_group: vscode-tunnel
  # The install and build count against the timeout too, so it leaves room
  # above the 55 minute hold for them and for the cleanup that deletes the note.
  timeout: 90m
  variables:
    GIT_DEPTH: '0'
    VSCODE_TUNNEL_KEEP_ALIVE_MINUTES: '55'
  script:
    - corepack enable
    - yarn install --immutable
    - yarn build || echo "The build failed; the tunnel opens anyway."
    - bash .gitlab/scripts/run-vscode-tunnel.sh
