---
# GitLab CI for the druxt.js monorepo: lint → test → secret-detection → preview,
# with collapsible section helpers and a per-file JSON/shell/YAML sweep.
#
# GitHub Actions (.github/workflows/ci.yml) is the canonical CI; this pipeline
# is additive, giving any GitLab mirror of this repo a real pipeline with
# secret-detection coverage and per-MR docs previews via GitLab Pages.

stages:
  - lint
  - test
  - secret-detection
  - preview

variables:
  SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: mcr.microsoft.com/devcontainers/python:3
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

#
# --- Node Job Template ---
#
# All node-based jobs share the same image and Yarn Berry cache. The cache key
# is the yarn.lock hash prefixed with the Node image tag, so a cache hit skips
# both the download and the native addon compilation (deasync, re2, etc.).
# The image prefix prevents restoring native binaries compiled under a
# different Node version. enableGlobalCache: false in .yarnrc.yml keeps the
# cache in .yarn/cache/ (project-local, CI-cacheable).
.node:
  image: node:16.20.1
  cache:
    - key:
        files:
          - yarn.lock
        prefix: node-16.20.1
      paths:
        - .yarn/cache/
        - node_modules/
      policy: pull-push
    - key:
        files:
          - docs/nuxt/yarn.lock
        prefix: node-16.20.1
      paths:
        - docs/nuxt/.yarn/cache/
        - docs/nuxt/node_modules/
      policy: pull-push

#
# --- Lint Stage ---
#

lint:json:
  stage: lint
  interruptible: true
  script:
    - section_start "json-lint" "Validating JSON files"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if python3 -m json.tool "$f" > /dev/null 2>&1; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.json' -not -path '*/.git/*' -not -path '*/node_modules/*' \
        -not -path '*/dist/*' -not -path '*/.vscode/*' -not -path '*/templates/*' -print0)
      echo "--- $count JSON file(s) checked ---"
      exit "$rc"
    - section_end "json-lint"

lint:shell:
  stage: lint
  interruptible: true
  script:
    - section_start "shell-lint" "Checking shell script syntax"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if bash -n "$f" 2>/dev/null; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.sh' -not -path '*/.git/*' -not -path '*/node_modules/*' -print0)
      echo "--- $count shell file(s) checked ---"
      exit "$rc"
    - section_end "shell-lint"

lint:yaml:
  stage: lint
  interruptible: true
  script:
    - section_start "yaml-lint" "Linting YAML files"
    - pip install yamllint -q
    - yamllint .gitlab-ci.yml
    - section_end "yaml-lint"

lint:markdown:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "md-lint" "Linting Markdown files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:md
    - section_end "md-lint"

lint:cspell:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "cspell" "Spell checking project files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:cspell
    - section_end "cspell"

# Prose-quality lint for docs/nuxt/content: flags AI-generated-text tells
# (em-dash overuse, hedging, anthropomorphic verbs, overused vocabulary, etc.)
# via the vale-ai-tells style package, scoped by docs/nuxt/.vale.ini to
# hand-authored content only (content/api and content/modules/*/readme are
# generated - see the exclusions in that file). Blocking: all real findings
# against current docs content are fixed, and ai-tells.ColonUsage is disabled
# site-wide (see the comment in .vale.ini) since it can't tell this site's
# "**term**: Description" convention apart from a genuine AI tell.
lint:vale:
  stage: lint
  interruptible: true
  script:
    - section_start "vale-install" "Installing Vale"
    - |
      vale_version="3.17.1"
      arch="$(uname -m)"
      case "$arch" in
        aarch64|arm64)
          vale_arch=arm64
          vale_sha256=92d91ebf9ee69ec077379be95cd09e6710ab33d3d5bab66bb482e66ebc80dc23
          ;;
        x86_64)
          vale_arch=64-bit
          vale_sha256=db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
          ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac
      curl -sL --max-time 60 "https://github.com/vale-cli/vale/releases/download/v${vale_version}/vale_${vale_version}_Linux_${vale_arch}.tar.gz" -o /tmp/vale.tar.gz
      echo "${vale_sha256}  /tmp/vale.tar.gz" | sha256sum -c - || { echo "vale checksum mismatch" >&2; exit 1; }
      tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
      chmod +x /usr/local/bin/vale
    - section_end "vale-install"
    - section_start "vale-style" "Installing the ai-tells style package"
    - |
      ai_tells_version="1.31.0"
      ai_tells_sha256="bc1267248f13e65928475c439ad7ae1bf806a20d09254c08d7d8c4a9c8b811f0"
      curl -sL --max-time 60 "https://github.com/tbhb/vale-ai-tells/releases/download/v${ai_tells_version}/ai-tells.zip" -o /tmp/ai-tells.zip
      echo "${ai_tells_sha256}  /tmp/ai-tells.zip" | sha256sum -c - || { echo "ai-tells checksum mismatch" >&2; exit 1; }
      python3 -c "
      import zipfile, os
      with zipfile.ZipFile('/tmp/ai-tells.zip') as z:
          for name in z.namelist():
              if name.startswith('ai-tells/styles/') and not name.endswith('/'):
                  target = os.path.join('docs/nuxt/styles', name[len('ai-tells/styles/'):])
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with open(target, 'wb') as f:
                      f.write(z.read(name))
      "
    - section_end "vale-style"
    - section_start "vale-lint" "Linting docs/nuxt/content for AI-tell prose patterns"
    - cd docs/nuxt
    - vale content
    - section_end "vale-lint"

lint:js:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "eslint" "Linting JS/Vue sources"
    - corepack enable
    - yarn install --immutable
    - yarn lint
    - section_end "eslint"

# Two-tier: the full recursive audit (including devDependencies) is reporting
# only - most of its findings live behind the Node 16/Yarn 3 toolchain freeze
# (see AGENTS.md) and aren't fixable without that separate, deliberate
# upgrade. The production-only gate is what actually blocks the pipeline -
# shipped runtime dependencies must stay clean.
lint:dependency-audit:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "audit-full" "Full dependency audit (reporting only, includes devDependencies)"
    - corepack enable
    - yarn install --immutable
    - yarn lint:audit:full || true
    - section_end "audit-full"
    - section_start "audit-production" "Production dependency audit (blocking)"
    - yarn lint:audit
    - section_end "audit-production"

lint:knip:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "knip" "Checking for unused/unlisted dependencies"
    - corepack enable
    - yarn install --immutable
    - yarn lint:knip
    - section_end "knip"

#
# --- Test Stage ---
#

test:unit:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "jest" "Running unit tests"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - NODE_OPTIONS="--max_old_space_size=8192" yarn test:unit --reporters=jest-junit --runInBand
    - section_end "jest"
  artifacts:
    when: always
    paths:
      - reports/junit/
    reports:
      junit: reports/junit/junit.xml

#
# --- Preview Stage ---
#
# Publishes a per-MR static build of docs/nuxt (druxtjs.org) as a GitLab Pages
# parallel deployment, so reviewers can see how inline-doc/API changes render
# before merging. Production (main) still deploys via Lagoon; this is
# MR-only and never touches that pipeline.
#
# Disabled for now: this GitLab instance doesn't have Pages actually reachable
# (no pages_external_url / exposed port / proxy host - see
# localhost/localhost#2 for what's missing). Kept defined, not deleted, so
# it's a one-line flip back to enabled once that's fixed. Until then, use the
# docs:review job below for an on-demand look at a build.

pages:preview:
  extends: .node
  stage: preview
  interruptible: true
  needs: []
  rules:
    - when: never
    # - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "docs-build" "Building druxtjs.org for MR preview"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn build:docs
    - cd docs/nuxt
    - yarn install --immutable
    - yarn generate
    - section_end "docs-build"
  pages:
    publish: docs/nuxt/dist
    path_prefix: '$CI_MERGE_REQUEST_IID'
    expire_in: 1 week
  environment:
    name: 'pages/mr-$CI_MERGE_REQUEST_IID'
    url: '$CI_PAGES_URL/$CI_MERGE_REQUEST_IID'
    on_stop: pages:preview:stop
    auto_stop_in: 1 week

pages:preview:stop:
  stage: preview
  interruptible: true
  needs: []
  rules:
    - when: never
    # - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    #   when: manual
  variables:
    GIT_STRATEGY: none
  environment:
    name: 'pages/mr-$CI_MERGE_REQUEST_IID'
    action: stop
  script:
    - echo "Stopping preview deployment for MR $CI_MERGE_REQUEST_IID"

# Manual, on-demand alternative to pages:preview while GitLab Pages isn't
# reachable: builds docs/nuxt and serves the static output through a
# Cloudflare quick tunnel (no account/token needed) for as long as the job
# runs. Click "Run" on this job in the pipeline view, then watch its log for
# the https://*.trycloudflare.com URL. Stop the job (or let it time out) when
# you're done reviewing - the tunnel dies with it.
docs:review:
  extends: .node
  stage: preview
  interruptible: false
  needs: []
  timeout: 1h
  rules:
    - when: manual
      allow_failure: true
  script:
    - section_start "docs-build" "Building druxtjs.org for review"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn build:docs
    - cd docs/nuxt
    - yarn install --immutable
    - yarn generate
    - section_end "docs-build"
    - section_start "tunnel" "Serving docs/nuxt/dist through a Cloudflare quick tunnel"
    - |
      cf_version="2026.7.3"
      arch="$(uname -m)"
      case "$arch" in
        aarch64|arm64)
          cf_arch=arm64
          cf_sha256=65259e652a7bea08bf5df603233ab22b8bf3116af8df9f9206209af6a1b955c0
          ;;
        x86_64)
          cf_arch=amd64
          cf_sha256=9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17
          ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac
      curl -sL "https://github.com/cloudflare/cloudflared/releases/download/${cf_version}/cloudflared-linux-${cf_arch}" -o /usr/local/bin/cloudflared
      echo "${cf_sha256}  /usr/local/bin/cloudflared" | sha256sum -c - || { echo "cloudflared checksum mismatch" >&2; exit 1; }
      chmod +x /usr/local/bin/cloudflared
    - npx --yes serve -l 8080 dist &
    - sleep 3
    - echo "Tunnel starting - the review URL will appear below as https://*.trycloudflare.com"
    - cloudflared tunnel --url http://localhost:8080 --no-autoupdate
    - section_end "tunnel"

# Manual: provisions docs/drupal + the example apps and exposes each over a
# Cloudflare quick tunnel for as long as the job runs. Click "Run" on this job,
# then watch its log for the https://*.trycloudflare.com URLs.
#
# Variables (all settable when triggering):
# - PREVIEW_EXAMPLES: CSV subset of site,daisyui,tailwind,bootstrapvue
#   (default: all four)
# - PREVIEW_MODE: dev (default) | prod | both. Dev = `yarn dev` on the app's
#   port (3001-3004; bootstrapvue is 3004 - its OAuth consumer's committed
#   redirect URI). Prod = `yarn build && yarn start` - in "both" mode prod
#   uses port+200 (3201-3204) so the dev and prod servers can coexist.
# - PREVIEW_DURATION_SECONDS: how long to keep the preview alive
#   (default 3600, clamped to 18000 - keep under the job timeout).
#
# code-server (VS Code in the browser) and the one-time Drupal login link
# are owner conveniences that only make sense with authentication: job logs
# can be readable by more people than you think, so both are skipped unless
# PREVIEW_CODE_PASSWORD is set. With it set, code-server requires that
# password (--auth password).
#
# Known limitation: the Content Ops Console (bootstrapvue) can't complete
# OAuth login through a random quick-tunnel hostname - its redirect is
# committed to localhost:3004/callback. That app is read-only over tunnels;
# use the devcontainer (or a local checkout) for its login flow.
examples:preview:
  stage: preview
  interruptible: false
  when: manual
  needs: []
  allow_failure: true
  resource_group: examples-preview
  timeout: 6h
  image: php:8.3
  variables:
    PREVIEW_EXAMPLES: 'site,daisyui,tailwind,bootstrapvue'
    PREVIEW_MODE: 'dev'
    PREVIEW_DURATION_SECONDS: '3600'
    # code-server's own install.sh prefixes "v" itself to build both the
    # release tag and asset filename - this was double-prefixed to "vv...",
    # 404ing every time (only surfaced once PREVIEW_CODE_PASSWORD started
    # reaching the job - it was unprotected before that, so this whole
    # branch never ran).
    CODE_SERVER_VERSION: '4.132.0'
    WEBSERVER_HOST: 127.0.0.1
    WEBSERVER_PORT: '8888'
    # python3/make/g++: the monorepo's native addons (deasync, re2) need
    # a compile toolchain that the minimal php image lacks.
    PHP_APT_PACKAGES: 'git unzip curl ca-certificates python3 python3-setuptools build-essential libsqlite3-dev libzip-dev libicu-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev libxml2-dev'
    PHP_EXTENSIONS: 'mbstring pdo_sqlite intl gd xml zip opcache'
  cache:
    - key:
        files:
          - yarn.lock
        prefix: php83-node16
      paths:
        - .yarn/cache/
        - node_modules/
      policy: pull-push
    - key:
        files:
          - docs/drupal/composer.lock
        prefix: php83
      paths:
        - docs/drupal/vendor/
      policy: pull-push
    # Static key: lockfile churn just costs one cold run, and CI's
    # files-key limit is 2 - not enough for the four example lockfiles.
    - key: examples-php83-node16
      paths:
        - examples/*/node_modules/
      policy: pull-push
  before_script:
    # default.before_script's section helpers are replaced by this
    # before_script, so redefine them here.
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s\r\e[0K\n" "$(date +%s)" "$1"; }'
    - apt-get update -yqq && apt-get install -yqq $PHP_APT_PACKAGES
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" $PHP_EXTENSIONS
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --version=2.10.2
    - export NVM_DIR="$HOME/.nvm" && curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
    - . "$NVM_DIR/nvm.sh" --no-use && nvm install && nvm use
    - node --version
    - corepack enable
    - |
      cf_version="2026.7.3"
      arch="$(uname -m)"
      case "$arch" in
        aarch64|arm64)
          cf_arch=arm64
          cf_sha256=65259e652a7bea08bf5df603233ab22b8bf3116af8df9f9206209af6a1b955c0
          ;;
        x86_64)
          cf_arch=amd64
          cf_sha256=9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17
          ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac
      curl -sL "https://github.com/cloudflare/cloudflared/releases/download/${cf_version}/cloudflared-linux-${cf_arch}" -o /usr/local/bin/cloudflared
      echo "${cf_sha256}  /usr/local/bin/cloudflared" | sha256sum -c - || { echo "cloudflared checksum mismatch" >&2; exit 1; }
      chmod +x /usr/local/bin/cloudflared
  script:
    - section_start "backend" "Provisioning the docs/drupal backend (SQLite, Docker-free)"
    - |
      set -euo pipefail
      cd docs/drupal
      .devtools/assemble
      .devtools/provision
      nohup .devtools/start > /tmp/drupal-start.log 2>&1 &
      cd "$CI_PROJECT_DIR"
    - |
      for i in $(seq 1 60); do
        if curl -fsS "http://${WEBSERVER_HOST}:${WEBSERVER_PORT}/" >/dev/null 2>&1; then echo "backend up"; break; fi
        sleep 5
      done
      curl -fsS "http://${WEBSERVER_HOST}:${WEBSERVER_PORT}/" >/dev/null
    - section_end "backend"
    - section_start "frontend" "Building the monorepo and starting the example apps"
    - |
      set -euo pipefail
      yarn install --immutable
      yarn build
    - |
      # Start helper: $1=variant $2=app $3=port. tailwind is a plain Vite
      # app (vite / vite preview --port); the others are Nuxt 2
      # (nuxt dev/start -p, which also overrides bootstrapvue's committed
      # config port when prod runs on port+200).
      run_variant() {
        variant="$1" app="$2" port="$3"
        dir="examples/druxt-$app"
        log="/tmp/${variant}-${app}.log"
        if [ "$variant" = prod ]; then (cd "$dir" && yarn install && yarn build) || exit 1; fi
        if [ "$app" = tailwind ]; then
          if [ "$variant" = dev ]; then
            (cd "$dir" && nohup yarn vite --port "$port" --strictPort > "$log" 2>&1 &)
          else
            (cd "$dir" && nohup yarn vite preview --port "$port" --strictPort > "$log" 2>&1 &)
          fi
        else
          if [ "$variant" = dev ]; then
            (cd "$dir" && nohup yarn dev -p "$port" > "$log" 2>&1 &)
          else
            (cd "$dir" && nohup yarn start -p "$port" > "$log" 2>&1 &)
          fi
        fi
      }
      # Deps first - the examples cache may be cold.
      IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
      for app in "${EXAMPLES[@]}"; do (cd "examples/druxt-$app" && yarn install); done
      for app in "${EXAMPLES[@]}"; do
        case "$app" in
          site) port=3001 ;;
          daisyui) port=3002 ;;
          tailwind) port=3003 ;;
          bootstrapvue) port=3004 ;;
          *) echo "unknown example: $app (expected site|daisyui|tailwind|bootstrapvue)" >&2; exit 1 ;;
        esac
        [ "$PREVIEW_MODE" = "prod" ] || run_variant dev "$app" "$port"
        [ "$PREVIEW_MODE" = "dev" ] || run_variant prod "$app" "$((port + 200))"
      done
    - |
      # Wait for each port to accept TCP - dev servers listen before their
      # first compile finishes, and the tunnel doesn't care either way.
      wait_port() {
        for i in $(seq 1 120); do
          (echo > "/dev/tcp/127.0.0.1/$1") 2>/dev/null && return 0
          sleep 5
        done
        echo "port $1 never opened" >&2; return 1
      }
      rc=0
      IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
      for app in "${EXAMPLES[@]}"; do
        case "$app" in site) p=3001 ;; daisyui) p=3002 ;; tailwind) p=3003 ;; bootstrapvue) p=3004 ;; esac
        [ "$PREVIEW_MODE" = "prod" ] || wait_port "$p" || rc=1
        [ "$PREVIEW_MODE" = "dev" ] || wait_port "$((p + 200))" || rc=1
      done
      # Not "exit $rc": script items share one shell, a bare exit ends
      # the job and skips the tunnel steps below.
      if [ "$rc" -ne 0 ]; then
        echo "one or more app ports never opened" >&2
        exit 1
      fi
    - section_end "frontend"
    - section_start "tunnels" "Opening Cloudflare quick tunnels"
    - |
      nohup cloudflared tunnel --url "http://${WEBSERVER_HOST}:${WEBSERVER_PORT}" --no-autoupdate > /tmp/tunnel-backend.log 2>&1 &
      IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
      for app in "${EXAMPLES[@]}"; do
        case "$app" in site) p=3001 ;; daisyui) p=3002 ;; tailwind) p=3003 ;; bootstrapvue) p=3004 ;; esac
        [ "$PREVIEW_MODE" = "prod" ] || nohup cloudflared tunnel --url "http://localhost:${p}" --no-autoupdate > "/tmp/tunnel-${app}-dev.log" 2>&1 &
        [ "$PREVIEW_MODE" = "dev" ] || nohup cloudflared tunnel --url "http://localhost:$((p + 200))" --no-autoupdate > "/tmp/tunnel-${app}-prod.log" 2>&1 &
      done
    - |
      tunnel_url() { grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" 2>/dev/null | head -1 || true; }
      for i in $(seq 1 30); do
        ready=1
        [ -n "$(tunnel_url /tmp/tunnel-backend.log)" ] || ready=0
        IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
        for app in "${EXAMPLES[@]}"; do
          case "$app" in site) p=3001 ;; daisyui) p=3002 ;; tailwind) p=3003 ;; bootstrapvue) p=3004 ;; esac
          if [ "$PREVIEW_MODE" != "prod" ] && [ -z "$(tunnel_url "/tmp/tunnel-${app}-dev.log")" ]; then ready=0; fi
          if [ "$PREVIEW_MODE" != "dev" ] && [ -z "$(tunnel_url "/tmp/tunnel-${app}-prod.log")" ]; then ready=0; fi
        done
        [ "$ready" -eq 1 ] && break
        sleep 2
      done
    - section_end "tunnels"
    - |
      set -euo pipefail
      tunnel_url() { grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" 2>/dev/null | head -1 || true; }
      FAILED=0
      BACKEND_URL="$(tunnel_url /tmp/tunnel-backend.log)"
      [ -n "$BACKEND_URL" ] || { echo "backend tunnel not ready"; tail -n 20 /tmp/tunnel-backend.log || true; FAILED=1; }
      IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
      for app in "${EXAMPLES[@]}"; do
        for variant in dev prod; do
          [ "$PREVIEW_MODE" = "both" ] || [ "$PREVIEW_MODE" = "$variant" ] || continue
          log="/tmp/tunnel-${app}-${variant}.log"
          url="$(tunnel_url "$log")"
          [ -n "$url" ] || { echo "$app ($variant) tunnel not ready"; tail -n 20 "$log" || true; FAILED=1; }
        done
      done
      [ "$FAILED" -eq 0 ] || exit 1
    - |
      # Content Ops Console's OAuth2 login computes its own redirect_uri
      # from whatever origin it's served from, so it works over the tunnel
      # too - as long as Drupal has that exact URI registered. The tunnel
      # hostname is random per run, so point the consumer's (single-value)
      # redirect field at it here instead of committing it. If both dev and
      # prod variants are running, the last one wins - the field can only
      # hold one URI.
      set -euo pipefail
      tunnel_url() { grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" 2>/dev/null | head -1 || true; }
      if [[ ",${PREVIEW_EXAMPLES}," == *",bootstrapvue,"* ]]; then
        for variant in dev prod; do
          [ "$PREVIEW_MODE" = "both" ] || [ "$PREVIEW_MODE" = "$variant" ] || continue
          url="$(tunnel_url "/tmp/tunnel-bootstrapvue-${variant}.log")"
          [ -n "$url" ] || continue
          CONSUMER_REDIRECT_URI="${url}/callback" \
            bash -c 'cd docs/drupal && PHPRC=.devtools/etc/php.ini vendor/bin/drush -y php-script .devtools/consumer-set-redirect.php'
        done
      fi
    - |
      set -euo pipefail
      tunnel_url() { grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" 2>/dev/null | head -1 || true; }
      CODE_ENABLED=false
      LOGIN_LINK=""
      if [ -n "${PREVIEW_CODE_PASSWORD:-}" ]; then
        curl -fsSL https://code-server.dev/install.sh | sh -s -- --version "$CODE_SERVER_VERSION"
        # code-server defaults to Open VSX, not the Microsoft Marketplace -
        # same recommendations as .devcontainer/devcontainer.json, so a
        # reviewer editing here gets the same PHP/Vue/lint tooling.
        for ext in \
          redhat.vscode-yaml \
          bmewburn.vscode-intelephense-client \
          ValeryanM.vscode-phpsab \
          SanderRonde.phpstan-vscode \
          Stanislav.vscode-drupal \
          Vue.volar \
          dbaeumer.vscode-eslint \
          bradlc.vscode-tailwindcss \
          antfu.iconify \
          vitest.explorer \
          davidanson.vscode-markdownlint \
          streetsidesoftware.code-spell-checker \
          EditorConfig.EditorConfig; do
          code-server --install-extension "$ext" || true
        done
        PASSWORD="$PREVIEW_CODE_PASSWORD" nohup code-server --auth password --bind-addr 0.0.0.0:8080 "$CI_PROJECT_DIR" > /tmp/code-server.log 2>&1 &
        nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/tunnel-code.log 2>&1 &
        for i in $(seq 1 30); do [ -n "$(tunnel_url /tmp/tunnel-code.log)" ] && break; sleep 2; done
        CODE_ENABLED=true
        BACKEND_URL="$(tunnel_url /tmp/tunnel-backend.log)"
        LOGIN_LINK="$(cd docs/drupal && PHPRC=.devtools/etc/php.ini vendor/bin/drush -y uli --uri="$BACKEND_URL" 2>/dev/null || true)"
      fi
      echo "=================================================="
      echo " Examples preview - live until this job is stopped"
      echo "=================================================="
      IFS=',' read -ra EXAMPLES <<< "${PREVIEW_EXAMPLES}"
      for app in "${EXAMPLES[@]}"; do
        case "$app" in
          site) label="druxt-site" ;;
          daisyui) label="Recipe Box (daisyui)" ;;
          tailwind) label="Meal Planner (tailwind)" ;;
          bootstrapvue) label="Content Ops Console (bootstrapvue)" ;;
        esac
        if [ "$PREVIEW_MODE" != "prod" ]; then
          echo " $label (dev):  $(tunnel_url "/tmp/tunnel-${app}-dev.log")"
        fi
        if [ "$PREVIEW_MODE" != "dev" ]; then
          echo " $label (prod): $(tunnel_url "/tmp/tunnel-${app}-prod.log")"
        fi
      done
      echo " Backend:      $(tunnel_url /tmp/tunnel-backend.log)"
      if [ "$CODE_ENABLED" = "true" ]; then
        echo " Login link:   ${LOGIN_LINK:-not ready}"
        echo " Code:         $(tunnel_url /tmp/tunnel-code.log) (password: your PREVIEW_CODE_PASSWORD variable)"
      else
        echo " (code-server + login link skipped - set PREVIEW_CODE_PASSWORD to enable)"
      fi
      echo "=================================================="
      DURATION="$PREVIEW_DURATION_SECONDS"
      [ "$DURATION" -le 18000 ] || DURATION=18000
      sleep "$DURATION"
