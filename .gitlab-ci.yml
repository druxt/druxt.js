---
# GitLab CI for the druxt.js monorepo: lint → test → secret-detection → preview,
# with collapsible section helpers and a per-file JSON/shell/YAML sweep.
#
# GitHub Actions (.github/workflows/ci.yml) is the canonical CI; this pipeline
# is additive, giving any GitLab mirror of this repo a real pipeline with
# secret-detection coverage and per-MR docs previews via GitLab Pages.

stages:
  - lint
  - test
  - secret-detection
  - preview

variables:
  SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: mcr.microsoft.com/devcontainers/python:3
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

#
# --- Node Job Template ---
#
# All node-based jobs share the same image and Yarn Berry cache. The cache key
# is the yarn.lock hash prefixed with the Node image tag, so a cache hit skips
# both the download and the native addon compilation (deasync, re2, etc.) — and
# the image prefix prevents restoring native binaries compiled under a
# different Node version. enableGlobalCache: false in .yarnrc.yml keeps the
# cache in .yarn/cache/ (project-local, CI-cacheable).
.node:
  image: node:16.20.1
  cache:
    - key:
        files:
          - yarn.lock
        prefix: node-16.20.1
      paths:
        - .yarn/cache/
        - node_modules/
      policy: pull-push
    - key:
        files:
          - docs/nuxt/yarn.lock
        prefix: node-16.20.1
      paths:
        - docs/nuxt/.yarn/cache/
        - docs/nuxt/node_modules/
      policy: pull-push

#
# --- Lint Stage ---
#

lint:json:
  stage: lint
  interruptible: true
  script:
    - section_start "json-lint" "Validating JSON files"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if python3 -m json.tool "$f" > /dev/null 2>&1; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.json' -not -path '*/.git/*' -not -path '*/node_modules/*' \
        -not -path '*/dist/*' -not -path '*/.vscode/*' -not -path '*/templates/*' -print0)
      echo "--- $count JSON file(s) checked ---"
      exit "$rc"
    - section_end "json-lint"

lint:shell:
  stage: lint
  interruptible: true
  script:
    - section_start "shell-lint" "Checking shell script syntax"
    - |
      rc=0; count=0
      while IFS= read -r -d '' f; do
        count=$((count + 1))
        if bash -n "$f" 2>/dev/null; then
          echo "  [PASS] $f"
        else
          echo "  [FAIL] $f"
          rc=1
        fi
      done < <(find . -name '*.sh' -not -path '*/.git/*' -not -path '*/node_modules/*' -print0)
      echo "--- $count shell file(s) checked ---"
      exit "$rc"
    - section_end "shell-lint"

lint:yaml:
  stage: lint
  interruptible: true
  script:
    - section_start "yaml-lint" "Linting YAML files"
    - pip install yamllint -q
    - yamllint .gitlab-ci.yml
    - section_end "yaml-lint"

lint:markdown:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "md-lint" "Linting Markdown files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:md
    - section_end "md-lint"

lint:cspell:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "cspell" "Spell checking project files"
    - corepack enable
    - yarn install --immutable
    - yarn lint:cspell
    - section_end "cspell"

# Prose-quality lint for docs/nuxt/content: flags AI-generated-text tells
# (em-dash overuse, hedging, anthropomorphic verbs, overused vocabulary, etc.)
# via the vale-ai-tells style package, scoped by docs/nuxt/.vale.ini to
# hand-authored content only (content/api and content/modules/*/readme are
# generated - see the exclusions in that file). Blocking: all real findings
# against current docs content are fixed, and ai-tells.ColonUsage is disabled
# site-wide (see the comment in .vale.ini) since it can't tell this site's
# "**term**: Description" convention apart from a genuine AI tell.
lint:vale:
  stage: lint
  interruptible: true
  script:
    - section_start "vale-install" "Installing Vale"
    - |
      vale_version="3.17.1"
      arch="$(uname -m)"
      case "$arch" in
        aarch64|arm64)
          vale_arch=arm64
          vale_sha256=92d91ebf9ee69ec077379be95cd09e6710ab33d3d5bab66bb482e66ebc80dc23
          ;;
        x86_64)
          vale_arch=64-bit
          vale_sha256=db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
          ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac
      curl -sL "https://github.com/vale-cli/vale/releases/download/v${vale_version}/vale_${vale_version}_Linux_${vale_arch}.tar.gz" -o /tmp/vale.tar.gz
      echo "${vale_sha256}  /tmp/vale.tar.gz" | sha256sum -c - || { echo "vale checksum mismatch" >&2; exit 1; }
      tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
      chmod +x /usr/local/bin/vale
    - section_end "vale-install"
    - section_start "vale-style" "Installing the ai-tells style package"
    - |
      ai_tells_version="1.31.0"
      ai_tells_sha256="bc1267248f13e65928475c439ad7ae1bf806a20d09254c08d7d8c4a9c8b811f0"
      curl -sL "https://github.com/tbhb/vale-ai-tells/releases/download/v${ai_tells_version}/ai-tells.zip" -o /tmp/ai-tells.zip
      echo "${ai_tells_sha256}  /tmp/ai-tells.zip" | sha256sum -c - || { echo "ai-tells checksum mismatch" >&2; exit 1; }
      python3 -c "
      import zipfile, os
      with zipfile.ZipFile('/tmp/ai-tells.zip') as z:
          for name in z.namelist():
              if name.startswith('ai-tells/styles/') and not name.endswith('/'):
                  target = os.path.join('docs/nuxt/styles', name[len('ai-tells/styles/'):])
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with open(target, 'wb') as f:
                      f.write(z.read(name))
      "
    - section_end "vale-style"
    - section_start "vale-lint" "Linting docs/nuxt/content for AI-tell prose patterns"
    - cd docs/nuxt
    - vale content
    - section_end "vale-lint"

lint:js:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "eslint" "Linting JS/Vue sources"
    - corepack enable
    - yarn install --immutable
    - yarn lint
    - section_end "eslint"

# Two-tier: the full recursive audit (including devDependencies) is reporting
# only - most of its findings live behind the Node 16/Yarn 3 toolchain freeze
# (see AGENTS.md) and aren't fixable without that separate, deliberate
# upgrade. The production-only gate is what actually blocks the pipeline -
# shipped runtime dependencies must stay clean.
lint:dependency-audit:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "audit-full" "Full dependency audit (reporting only, includes devDependencies)"
    - corepack enable
    - yarn install --immutable
    - yarn lint:audit:full || true
    - section_end "audit-full"
    - section_start "audit-production" "Production dependency audit (blocking)"
    - yarn lint:audit
    - section_end "audit-production"

lint:knip:
  extends: .node
  stage: lint
  interruptible: true
  script:
    - section_start "knip" "Checking for unused/unlisted dependencies"
    - corepack enable
    - yarn install --immutable
    - yarn lint:knip
    - section_end "knip"

#
# --- Test Stage ---
#

test:unit:
  extends: .node
  stage: test
  interruptible: true
  needs: []
  script:
    - section_start "jest" "Running unit tests"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - NODE_OPTIONS="--max_old_space_size=8192" yarn test:unit --reporters=jest-junit --runInBand
    - section_end "jest"
  artifacts:
    when: always
    paths:
      - reports/junit/
    reports:
      junit: reports/junit/junit.xml

#
# --- Preview Stage ---
#
# Publishes a per-MR static build of docs/nuxt (druxtjs.org) as a GitLab Pages
# parallel deployment, so reviewers can see how inline-doc/API changes render
# before merging. Production (main) still deploys via Lagoon; this is
# MR-only and never touches that pipeline.
#
# Disabled for now: this GitLab instance doesn't have Pages actually reachable
# (no pages_external_url / exposed port / proxy host - see
# localhost/localhost#2 for what's missing). Kept defined, not deleted, so
# it's a one-line flip back to enabled once that's fixed. Until then, use the
# docs:review job below for an on-demand look at a build.

pages:preview:
  extends: .node
  stage: preview
  interruptible: true
  needs: []
  rules:
    - when: never
    # - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "docs-build" "Building druxtjs.org for MR preview"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn build:docs
    - cd docs/nuxt
    - yarn install --immutable
    - yarn generate
    - section_end "docs-build"
  pages:
    publish: docs/nuxt/dist
    path_prefix: '$CI_MERGE_REQUEST_IID'
    expire_in: 1 week
  environment:
    name: 'pages/mr-$CI_MERGE_REQUEST_IID'
    url: '$CI_PAGES_URL/$CI_MERGE_REQUEST_IID'
    on_stop: pages:preview:stop
    auto_stop_in: 1 week

pages:preview:stop:
  stage: preview
  interruptible: true
  needs: []
  rules:
    - when: never
    # - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    #   when: manual
  variables:
    GIT_STRATEGY: none
  environment:
    name: 'pages/mr-$CI_MERGE_REQUEST_IID'
    action: stop
  script:
    - echo "Stopping preview deployment for MR $CI_MERGE_REQUEST_IID"

# Manual, on-demand alternative to pages:preview while GitLab Pages isn't
# reachable: builds docs/nuxt and serves the static output through a
# Cloudflare quick tunnel (no account/token needed) for as long as the job
# runs. Click "Run" on this job in the pipeline view, then watch its log for
# the https://*.trycloudflare.com URL. Stop the job (or let it time out) when
# you're done reviewing - the tunnel dies with it.
docs:review:
  extends: .node
  stage: preview
  interruptible: false
  needs: []
  timeout: 1h
  rules:
    - when: manual
      allow_failure: true
  script:
    - section_start "docs-build" "Building druxtjs.org for review"
    - corepack enable
    - yarn install --immutable
    - yarn build
    - yarn build:docs
    - cd docs/nuxt
    - yarn install --immutable
    - yarn generate
    - section_end "docs-build"
    - section_start "tunnel" "Serving docs/nuxt/dist through a Cloudflare quick tunnel"
    - |
      cf_version="2026.7.3"
      arch="$(uname -m)"
      case "$arch" in
        aarch64|arm64)
          cf_arch=arm64
          cf_sha256=65259e652a7bea08bf5df603233ab22b8bf3116af8df9f9206209af6a1b955c0
          ;;
        x86_64)
          cf_arch=amd64
          cf_sha256=9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17
          ;;
        *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
      esac
      curl -sL "https://github.com/cloudflare/cloudflared/releases/download/${cf_version}/cloudflared-linux-${cf_arch}" -o /usr/local/bin/cloudflared
      echo "${cf_sha256}  /usr/local/bin/cloudflared" | sha256sum -c - || { echo "cloudflared checksum mismatch" >&2; exit 1; }
      chmod +x /usr/local/bin/cloudflared
    - npx --yes serve -l 8080 dist &
    - sleep 3
    - echo "Tunnel starting - the review URL will appear below as https://*.trycloudflare.com"
    - cloudflared tunnel --url http://localhost:8080 --no-autoupdate
    - section_end "tunnel"
