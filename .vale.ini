# AI-tell prose lint for hand-authored content: markdown and source comments
# (the JSDoc blocks are the source of the generated API docs).
#
# Styles are downloaded, version and checksum pinned, by the CI lint job and
# by `yarn lint:prose:install`; they are not committed.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = ai-tells

# In code comments the punctuation rules misfire on technical syntax: CLI
# flags (--force), CSS custom properties (--primary), Vue binding shorthand
# (:src) and JSDoc tag colons are syntax, not prose tells. The vocabulary and
# structure rules still apply.
[*.{js,mjs,vue}]
BasedOnStyles = ai-tells
ai-tells.DoubleHyphen = NO
ai-tells.ColonUsage = NO
ai-tells.SemicolonUsage = NO
ai-tells.EmDashUsage = NO
