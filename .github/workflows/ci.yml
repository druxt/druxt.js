# GitHub CI for the 2.0.x line.
#
# The workflows split the repository by line. The 1.x workflows run on the
# 0.x and *.x release lines, and this file runs on the 2.0.x line and on pull
# requests based on it or on a stacked 2.0.x feature branch. Two others still
# run on this line: codeql-analysis.yml, since CodeQL reads the tree rather
# than the toolchain, and release.yml, whose triggers keep it off 2.0.x until
# the 2.x release flow returns.
#
# It mirrors the GitLab jobs of the same names in .gitlab-ci.yml that apply on
# GitHub: lint:js, lint:markdown, lint:cspell, lint:knip, lint:commits,
# test:unit, test:typecheck and test:release. Secret detection, the dependency
# audit and the preview jobs stay on GitLab. Only the release script tests of
# test:release run here; its rehearsal half (snapshot version, build,
# release:check) returns with the packages. test:standalone waits for a
# backend this workflow can start, the mock-backed standalone suite. Later
# changes on this line add the jobs for tools this tree does not have yet.
#
# lint-commits runs the GitLab job's commands: the identity check, and
# commitlint under the base tip's commitlint.config.js, so a pull request
# cannot loosen the policy that checks it. The commitlint packages and plugins
# that config loads are still the head's, installed from its lockfile; GitLab
# installs the base tip's in a worktree.

name: CI

on:
  push:
    branches: ['2.0.x']
  pull_request:
    # The filter matches the pull request's base, and pull requests on this
    # line are stacked on each other, so the feature branches are listed too.
    branches: ['2.0.x', 'feature/2.0.x-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn lint

  lint-markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn lint:md

  lint-cspell:
    name: Lint (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn lint:cspell

  lint-knip:
    name: Lint (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn lint:knip

  lint-changesets:
    name: Lint (changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      # The shape and the wording rules of .changeset/*.md, so the version
      # pull request needs no clean-up pass before a release.
      - name: Changesets
        run: yarn lint:changesets --preview

  lint-commits:
    name: Lint (commit messages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - name: Commit identity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # From the base tip, as the commitlint config below: a pull request
          # must not loosen the policy that checks it. A base tip without the
          # list fails here rather than passing as "no identities found".
          git show "$BASE_SHA:.husky/agent-identities" > .agent-identities
          if git log --format='%an <%ae>%n%cn <%ce>' "$BASE_SHA..$HEAD_SHA" \
            | grep -iEf .agent-identities; then
            echo "::error::A commit above is made under an AI agent's identity. See AGENTS.md."
            exit 1
          fi
      - name: Lint the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Written into the checkout, not a temporary directory, so the
          # modules it requires resolve from this node_modules.
          git show "$BASE_SHA:commitlint.config.js" > .commitlint-base.config.js
          yarn lint:commit --config .commitlint-base.config.js --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Lint the pushed commits
        if: github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch, or a manual run, has no previous tip to start from.
          case "$BEFORE" in
            '' | 0000000000000000000000000000000000000000) BEFORE="$AFTER~1" ;;
          esac
          yarn lint:commit --from "$BEFORE" --to "$AFTER"

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      # The tests import the workspaces through their dist, as on GitLab.
      - run: yarn build
      # The unit and component projects: the standalone one needs a Drupal backend.
      - run: yarn vitest run --project unit --project nuxt

  typecheck:
    name: Test (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck

  release-check:
    name: Test (release scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn release:check:test
