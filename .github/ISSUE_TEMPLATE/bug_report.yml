name: Bug report
description: A Druxt package does not work the way its documentation says, or the way a previous release did.
labels: ['bug', 'needs triage']
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form. Report it privately at https://github.com/druxt/druxt.js/security/advisories/new instead.

        **Not sure it's a Druxt bug?** Many reports turn out to be configuration, or a Drupal module, which is fixed in its own queue on drupal.org: [druxt](https://www.drupal.org/project/issues/druxt), [decoupled_router](https://www.drupal.org/project/issues/decoupled_router), [jsonapi_views](https://www.drupal.org/project/issues/jsonapi_views) or [jsonapi_menu_items](https://www.drupal.org/project/issues/jsonapi_menu_items). The [documentation](https://druxtjs.org) is the place to check. If you use an AI tool, you can connect it to the [Druxt docs MCP server](https://druxtjs.org/mcp) and paste:

        ```text
        Check this against the Druxt docs before I report a bug.
        1. Documented behaviour or a configuration mistake?
           Link the page.
        2. If not, which Druxt package or Drupal module is it?
        3. What are the smallest steps that reproduce it?
        Ask me for what you need. Be brief. Don't write the issue.

        What I see:
        ```

        Either way, fill in this form yourself, with what you saw. Remove credentials, tokens and private hostnames from anything you paste into an AI tool or into this form.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: The Druxt package the problem shows up in. Pick "Not sure" if you can't tell.
      multiple: true
      options:
        - '@druxt/client'
        - '@druxt/core'
        - '@druxt/router'
        - '@druxt/schema'
        - '@druxt/entity'
        - '@druxt/views'
        - '@druxt/menu'
        - '@druxt/breadcrumb'
        - '@druxt/blocks'
        - '@druxt/site'
        - '@druxt/compat'
        - '@druxt/devtools'
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Include the component or store action involved if you know it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, and where that behaviour is documented or worked before.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        The smallest set of steps that shows the problem. A repository or a starter kit that
        reproduces it is the fastest route to a fix. Include the Druxt part of your
        `nuxt.config.js` if it matters.
      placeholder: |
        1. Install ...
        2. Add to nuxt.config.js ...
        3. Visit ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        The Druxt packages, Nuxt, Drupal, the Drupal modules Druxt uses, Node and the package
        manager. `npm ls --depth=0`, or `yarn info --name-only` with Yarn, and
        `drush pm:list --status=enabled` list most of them. For a problem in the browser, add
        the browser and the operating system.
      placeholder: |
        @druxt/core: 2.0.0-alpha.0
        @druxt/site: 2.0.0-alpha.0
        nuxt: 4.5.2
        drupal/core: 11.2.5
        drupal/druxt: 1.3.1
        drupal/decoupled_router: 2.0.7
        node: 24.18.0
        yarn: 4.18.1
        browser: Chrome 142 on macOS 15
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: >
        Browser console, Nuxt server output, or the Drupal log. The JSON:API response involved
        helps too. Remove tokens, cookies and private hostnames first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and found no report of this.
          required: false
        - label: I used an AI tool to look into this, and I have checked every detail in this report myself.
          required: false
