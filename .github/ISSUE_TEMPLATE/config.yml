blank_issues_enabled: true
contact_links:
  - name: Ask your AI tool, with the Druxt docs
    url: https://druxtjs.org/mcp
    about: Connect Claude Code, Cursor, VS Code or OpenCode to the Druxt docs MCP server, and ask it how to use Druxt.
  - name: Ask the community
    url: https://discord.druxtjs.org
    about: The community Discord is the fastest way to get help from people.
  - name: Read the documentation
    url: https://druxtjs.org
    about: Tutorials, how-to guides, explanation and API reference.
  - name: Report a security vulnerability
    url: https://github.com/druxt/druxt.js/security/advisories/new
    about: Private disclosure. Please do not open a public issue.
  - name: Report a Drupal module issue
    url: https://www.drupal.org/project/issues/druxt
    about: The Druxt Drupal module is maintained on drupal.org, as are Decoupled Router, JSON:API Views and JSON:API Menu Items.
