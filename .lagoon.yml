docker-compose-yaml: ./docker-compose.yml

routes:
  insecure: Redirect

tasks:
  post-rollout:
    - run:
        name: Report preview URL to GitHub as a Deployment
        command: node scripts/notify-github-deployment.js
        service: app
        shell: bash

environments:
  main:
    routes:
      - app:
          - druxtjs.org
          - www.druxtjs.org
      - nginx:
          - blocks.druxtjs.org
          - breadcrumb.druxtjs.org
          - entity.druxtjs.org
          - menu.druxtjs.org
          - router.druxtjs.org
          - schema.druxtjs.org
          - site.druxtjs.org
          - views.druxtjs.org
